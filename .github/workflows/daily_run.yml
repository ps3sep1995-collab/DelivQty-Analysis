name: Daily Bhavcopy Scanner

on:
  schedule:
    - cron: '30 11 * * 0-6'  # सोमवार से शुक्रवार शाम 5:30 बजे IST (11:30 AM UTC)
  workflow_dispatch:


jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy

      - name: Download Bhavcopy Data
        run: python 1_download_data.py

      - name: Process Scan Data
        run: python 2_process_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Bhavcopy & Scan Reports"
            git pull --rebase origin main -X ours
            git push
          else
            echo "No changes to commit"
          fi
