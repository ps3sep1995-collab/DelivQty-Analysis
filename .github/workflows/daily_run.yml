name: Daily Bhavcopy Scanner

on:
  schedule:
    - cron: '30 13 * * 1-5' # सोमवार से शुक्रवार
  workflow_dispatch: # मैनुअल रन करने के लिए

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests

      # 🚨 यहाँ नीचे इन लाइनों को पेस्ट करें 🚨
      - name: Clean Old Processed Data
        run: |
          rm -rf data/processed/*
          
      - name: Run Data Downloader
        run: python 1_download_data.py

      - name: Run Data Processor
        run: python 2_process_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update deliverable breakout data" || exit 0
          git push