<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE F&O Deliverable Volume Breakout Scanner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .modal-bg { background-color: rgba(0, 0, 0, 0.6); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-10 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-emerald-400 flex items-center gap-2">
                <i class="fa-solid me-2 fa-chart-line"></i> NSE F&O Delivery Breakout Scanner
            </h1>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <input type="text" id="searchInput" placeholder="Search Symbol..." 
                       class="bg-slate-700 text-white px-4 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-500 w-full md:w-64">
                <span id="totalCount" class="bg-emerald-500/10 text-emerald-400 px-3 py-2 rounded-lg border border-emerald-500/20 text-sm font-semibold whitespace-nowrap">
                    Loading...
                </span>
            </div>
        </div>
    </header>

    <!-- Main Table Container -->
    <main class="max-w-7xl mx-auto p-4 md:p-6">
        <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-xl overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-700/50 text-slate-300 text-xs uppercase tracking-wider border-b border-slate-700">
                        <th class="p-4">Symbol</th>
                        <th class="p-4">Date</th>
                        <th class="p-4 text-right">Close Price</th>
                        <th class="p-4 text-right">% Change</th>
                        <th class="p-4 text-right">Deliverable Qty</th>
                        <th class="p-4 text-center">Breakout Type</th>
                        <th class="p-4 text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-slate-700/50 text-sm">
                    <tr>
                        <td colspan="7" class="text-center p-8 text-slate-400">
                            <i class="fa-solid fa-spinner fa-spin text-2xl text-emerald-400 mb-2"></i><br>
                            Loading Breakout Data...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- History Popup Modal -->
    <div id="historyModal" class="fixed inset-0 modal-bg hidden justify-center items-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-3xl w-full max-h-[85vh] flex flex-col shadow-2xl">
            <!-- Modal Header -->
            <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/80 rounded-t-xl">
                <div>
                    <h3 id="modalSymbol" class="text-xl font-bold text-emerald-400">SYMBOL</h3>
                    <p class="text-xs text-slate-400">NSE Historical Delivery Data</p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-2 text-xl font-bold">
                    &times;
                </button>
            </div>
            <!-- Modal Body (History Table) -->
            <div class="p-4 overflow-y-auto flex-1">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-slate-400 text-xs border-b border-slate-700 uppercase">
                            <th class="pb-2">Date</th>
                            <th class="pb-2 text-right">Close</th>
                            <th class="pb-2 text-right">% Chg</th>
                            <th class="pb-2 text-right">Deliverable Qty</th>
                        </tr>
                    </thead>
                    <tbody id="modalTableBody" class="divide-y divide-slate-700/30 text-sm">
                        <!-- History Rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript Execution -->
    <script>
        let breakoutData = [];
        let fullHistoryData = {};

        // Fetch Both CSV and History JSON
        async function loadDashboardData() {
            try {
                // Fetch Breakout CSV
                const csvRes = await fetch('data/processed/volume_breakout_scan.csv');
                const csvText = await csvRes.text();
                breakoutData = parseCSV(csvText);

                // Fetch History JSON
                const jsonRes = await fetch('data/processed/full_history_data.json');
                fullHistoryData = await jsonRes.json();

                renderTable(breakoutData);
            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('tableBody').innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center p-8 text-rose-400">
                            ❌ डेटा लोड करने में असमर्थ। कृपया Actions Workflow पूरा होने का इंतज़ार करें।
                        </td>
                    </tr>`;
            }
        }

        // CSV Parser Helper
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim().toUpperCase());
            
            return lines.slice(1).map(line => {
                const values = line.split(',').map(v => v.trim());
                let row = {};
                headers.forEach((h, idx) => {
                    row[h] = values[idx];
                });
                return row;
            });
        }

        // Render Breakout Main Table
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            document.getElementById('totalCount').innerText = `${data.length} Stocks Found`;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-8 text-slate-400">कोई ब्रेकआउट नहीं मिला</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(row => {
                const pct = parseFloat(row.PCT_CHANGE || 0);
                const pctClass = pct >= 0 ? 'text-emerald-400' : 'text-rose-400';
                const delivQty = Number(row.DELIV_QTY || 0).toLocaleString('en-IN');

                return `
                    <tr class="hover:bg-slate-700/30 transition">
                        <td class="p-4 font-bold text-white">${row.SYMBOL}</td>
                        <td class="p-4 text-slate-300">${row.DATE}</td>
                        <td class="p-4 text-right font-semibold">₹${parseFloat(row.CLOSE || 0).toFixed(2)}</td>
                        <td class="p-4 text-right font-semibold ${pctClass}">${pct > 0 ? '+' : ''}${pct}%</td>
                        <!-- 🚨 EXACT DELIVERABLE QTY FIELD DISPLAYED HERE -->
                        <td class="p-4 text-right font-bold text-emerald-300">${delivQty}</td>
                        <td class="p-4 text-center">
                            <span class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-full text-xs font-bold">
                                ${row.BREAKOUT_TYPE} Breakout
                            </span>
                        </td>
                        <td class="p-4 text-center">
                            <button onclick="openHistoryModal('${row.SYMBOL}')" 
                                    class="bg-slate-700 hover:bg-emerald-600 text-slate-200 hover:text-white px-3 py-1.5 rounded-md text-xs transition">
                                <i class="fa-solid fa-clock-rotate-left mr-1"></i> History
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Open Modal Function
        function openHistoryModal(symbol) {
            const history = fullHistoryData[symbol] || [];
            document.getElementById('modalSymbol').innerText = `${symbol} History`;
            
            const modalBody = document.getElementById('modalTableBody');
            if (history.length === 0) {
                modalBody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-slate-400">No History Available</td></tr>`;
            } else {
                modalBody.innerHTML = history.map(item => {
                    const pct = parseFloat(item.PCT_CHANGE || 0);
                    const pctClass = pct >= 0 ? 'text-emerald-400' : 'text-rose-400';
                    const delivQty = Number(item.DELIV_QTY || 0).toLocaleString('en-IN');

                    return `
                        <tr class="hover:bg-slate-700/40">
                            <td class="py-2.5 text-slate-300">${item.DATE}</td>
                            <td class="py-2.5 text-right font-medium">₹${parseFloat(item.CLOSE || 0).toFixed(2)}</td>
                            <td class="py-2.5 text-right font-medium ${pctClass}">${pct > 0 ? '+' : ''}${pct}%</td>
                            <td class="py-2.5 text-right font-bold text-slate-200">${delivQty}</td>
                        </tr>
                    `;
                }).join('');
            }

            document.getElementById('historyModal').classList.remove('hidden');
            document.getElementById('historyModal').classList.add('flex');
        }

        // Close Modal Function
        function closeModal() {
            document.getElementById('historyModal').classList.add('hidden');
            document.getElementById('historyModal').classList.remove('flex');
        }

        // Live Search Filter
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toUpperCase().trim();
            const filtered = breakoutData.filter(r => r.SYMBOL.includes(val));
            renderTable(filtered);
        });

        // Initialize App
        window.onload = loadDashboardData;
    </script>
</body>
</html>
