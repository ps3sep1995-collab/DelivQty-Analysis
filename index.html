<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F&O Delivery 2x Breakout Terminal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151921;
            --card-border: #222936;
            --accent-green: #00e676;
            --accent-red: #ff5252;
            --text-main: #f0f4f8;
            --text-muted: #8b95a5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; }

        /* App Header */
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 20px; color: var(--text-main); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .header h1 span { color: var(--accent-green); }

        /* Filter Panel */
        .filter-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .field-group { display: flex; flex-direction: column; gap: 6px; }
        .field-group label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        
        input {
            background: #0b0e14;
            border: 1px solid #2a3241;
            border-radius: 8px;
            padding: 10px 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
            width: 100%;
        }
        input:focus { border-color: var(--accent-green); box-shadow: 0 0 8px rgba(0, 230, 118, 0.2); }

        .btn-group { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-apply { background: var(--accent-green); color: #000; }
        .btn-apply:active { transform: scale(0.98); opacity: 0.9; }
        .btn-reset { background: #222936; color: #fff; }

        /* Table Dashboard */
        .stats-bar { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 10px; padding: 0 4px; }
        
        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #1a202c; color: var(--text-muted); font-size: 11px; text-transform: uppercase; padding: 12px; border-bottom: 1px solid var(--card-border); font-weight: 600; }
        td { padding: 12px; font-size: 13px; border-bottom: 1px solid #1a202c; }
        tbody tr { transition: background 0.2s; cursor: pointer; }
        tbody tr:hover { background: #1e2634; }

        /* Color utilities & Badges */
        .green { color: var(--accent-green); font-weight: 600; }
        .red { color: var(--accent-red); font-weight: 600; }
        .badge {
            background: rgba(0, 230, 118, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(0, 230, 118, 0.3);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }

        /* Modal Popup */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            margin: 10% auto;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .close-btn { color: var(--text-muted); float: right; font-size: 22px; cursor: pointer; }
        .close-btn:hover { color: #fff; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            th, td { padding: 10px 8px; font-size: 12px; }
            .modal-content { margin: 20% auto; width: 95%; padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 <span>F&O 2x Breakout</span> Terminal</h1>
    </div>

    <!-- Filter Card -->
    <div class="filter-card">
        <div class="filter-grid">
            <div class="field-group">
                <label>Single Date</label>
                <input type="date" id="singleDate">
            </div>
            <div class="field-group">
                <label>From Date</label>
                <input type="date" id="fromDate">
            </div>
            <div class="field-group">
                <label>To Date</label>
                <input type="date" id="toDate">
            </div>
            <div class="field-group">
                <label>Symbol</label>
                <input type="text" id="symbolSearch" placeholder="SEARCH (e.g. RELIANCE)">
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-apply" onclick="applyFilters()">फ़िल्टर लागू करें</button>
            <button class="btn-reset" onclick="resetFilters()">रीसेट</button>
        </div>
    </div>

    <div class="stats-bar">
        <span>स्कैन रिजल्ट्स</span>
        <span id="stats">डेटा लोड हो रहा है...</span>
    </div>

    <!-- Data Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>DATE</th>
                    <th>SYMBOL</th>
                    <th>CLOSE</th>
                    <th>% CHG</th>
                    <th>DELIVERY QTY</th>
                    <th>TYPE</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">लोड हो रहा है...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Modal Popup -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle" style="color: var(--accent-green); font-size: 16px; margin-bottom: 4px;"></h3>
            <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 15px;">पिछले 10 दिनों का अनफ़िल्टर्ड डिलीवरी डेटा</p>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>DATE</th>
                            <th>CLOSE</th>
                            <th>% CHG</th>
                            <th>DELIVERY QTY</th>
                        </tr>
                    </thead>
                    <tbody id="modalTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let rawData = [];
        let fullHistory = {};

        // 1. Load Breakout CSV
        Papa.parse("data/processed/volume_breakout_scan.csv", {
            download: true,
            header: true,
            complete: function(results) {
                rawData = results.data.filter(r => r.SYMBOL);
                displayData(rawData);
            }
        });

        // 2. Load Full History JSON for Popup
        fetch("data/processed/full_history_data.json")
            .then(res => res.json())
            .then(data => fullHistory = data)
            .catch(err => console.log("JSON Error:", err));

        function displayData(data) {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";
            document.getElementById("stats").innerText = `कुल स्टॉक्स: ${data.length}`;

            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 20px;">कोई 2x ब्रेकआउट स्टॉक नहीं मिला!</td></tr>`;
                return;
            }

            data.forEach(row => {
                const pct = parseFloat(row.PCT_CHANGE || 0);
                const pctClass = pct >= 0 ? 'green' : 'red';
                const sign = pct >= 0 ? '+' : '';
                const tr = document.createElement("tr");

                tr.onclick = () => openHistoryPopup(row.SYMBOL, row.DATE);

                tr.innerHTML = `
                    <td style="color: var(--text-muted); font-size: 12px;">${row.DATE}</td>
                    <td><strong style="color: #fff;">${row.SYMBOL}</strong></td>
                    <td>${parseFloat(row.CLOSE).toFixed(2)}</td>
                    <td class="${pctClass}">${sign}${pct.toFixed(2)}%</td>
                    <td>${parseInt(row.DELIV_QTY).toLocaleString()}</td>
                    <td><span class="badge">${row.BREAKOUT_TYPE}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openHistoryPopup(symbol, selectedDate) {
            const modal = document.getElementById("historyModal");
            const modalTitle = document.getElementById("modalTitle");
            const modalTbody = document.getElementById("modalTableBody");

            modalTitle.innerText = `📈 ${symbol} - Price & Delivery Trend`;
            modalTbody.innerHTML = "";

            if (fullHistory[symbol]) {
                let stockHistory = fullHistory[symbol]
                    .filter(item => item.DATE <= selectedDate)
                    .slice(0, 10);

                stockHistory.forEach(r => {
                    const pct = parseFloat(r.PCT_CHANGE || 0);
                    const pctClass = pct >= 0 ? 'green' : 'red';
                    const sign = pct >= 0 ? '+' : '';
                    const tr = document.createElement("tr");

                    tr.innerHTML = `
                        <td style="color: var(--text-muted);">${r.DATE}</td>
                        <td>${parseFloat(r.CLOSE).toFixed(2)}</td>
                        <td class="${pctClass}">${sign}${pct.toFixed(2)}%</td>
                        <td>${parseInt(r.DELIV_QTY).toLocaleString()}</td>
                    `;
                    modalTbody.appendChild(tr);
                });
            } else {
                modalTbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">डेटा उपलब्ध नहीं है</td></tr>`;
            }

            modal.style.display = "block";
        }

        function closeModal() {
            document.getElementById("historyModal").style.display = "none";
        }

        function applyFilters() {
            const singleDate = document.getElementById("singleDate").value;
            const fromDate = document.getElementById("fromDate").value;
            const toDate = document.getElementById("toDate").value;
            const symbol = document.getElementById("symbolSearch").value.trim().toUpperCase();

            let filtered = rawData;

            if (singleDate) {
                filtered = filtered.filter(r => r.DATE === singleDate);
            } else if (fromDate && toDate) {
                filtered = filtered.filter(r => r.DATE >= fromDate && r.DATE <= toDate);
            }

            if (symbol) {
                filtered = filtered.filter(r => r.SYMBOL.includes(symbol));
            }

            displayData(filtered);
        }

        function resetFilters() {
            document.getElementById("singleDate").value = "";
            document.getElementById("fromDate").value = "";
            document.getElementById("toDate").value = "";
            document.getElementById("symbolSearch").value = "";
            displayData(rawData);
        }
    </script>
</body>
</html>
