<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F&O Delivery 2x Breakout Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f17; }
        .card-bg { background-color: #121824; }
        .input-bg { background-color: #1a2232; border-color: #2a3447; }
        .table-header { background-color: #161d2b; }
    </style>
</head>
<body class="text-slate-200 min-h-screen font-sans p-3 md:p-6">

    <!-- Header -->
    <header class="flex justify-between items-center mb-6 max-w-5xl mx-auto">
        <h1 class="text-xl md:text-2xl font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-ghost text-slate-400"></i> F&O Delivery 2x Breakout Terminal
        </h1>
        <button onclick="resetFilters()" class="text-slate-400 hover:text-white text-xl">
            <i class="fa-solid fa-arrows-rotate"></i>
        </button>
    </header>

    <main class="max-w-5xl mx-auto space-y-6">

        <!-- Filters Box -->
        <div class="card-bg p-4 md:p-6 rounded-xl border border-slate-800 shadow-lg">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <!-- Single Date -->
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2">SINGLE DATE</label>
                    <input type="date" id="singleDate" class="w-full input-bg text-white px-3 py-2.5 rounded-lg border text-sm focus:outline-none focus:border-emerald-500">
                </div>

                <!-- From Date -->
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2">FROM DATE</label>
                    <input type="date" id="fromDate" class="w-full input-bg text-white px-3 py-2.5 rounded-lg border text-sm focus:outline-none focus:border-emerald-500">
                </div>

                <!-- To Date -->
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2">TO DATE</label>
                    <input type="date" id="toDate" class="w-full input-bg text-white px-3 py-2.5 rounded-lg border text-sm focus:outline-none focus:border-emerald-500">
                </div>

                <!-- Symbol Search -->
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2">SYMBOL</label>
                    <input type="text" id="symbolSearch" placeholder="SEARCH (e.g. RELIAN)" class="w-full input-bg text-white px-3 py-2.5 rounded-lg border text-sm focus:outline-none focus:border-emerald-500 uppercase">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-4 pt-2">
                <button onclick="applyFilters()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 px-4 rounded-lg text-sm transition shadow-lg shadow-emerald-500/20">
                    फ़िल्टर लागू करें
                </button>
                <button onclick="resetFilters()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 px-4 rounded-lg text-sm border border-slate-700 transition">
                    रीसेट
                </button>
            </div>
        </div>

        <!-- Results Counter Bar -->
        <div class="flex justify-between items-center text-sm px-1">
            <span class="text-slate-400">स्कैन रिजल्ट्स</span>
            <span class="text-slate-300 font-medium">कुल स्टॉक्स: <span id="stockCount" class="text-white font-bold">0</span></span>
        </div>

        <!-- Data Table -->
        <div class="card-bg rounded-xl border border-slate-800 overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="table-header text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                            <th class="p-4">DATE</th>
                            <th class="p-4">SYMBOL</th>
                            <th class="p-4 text-right">CLOSE</th>
                            <th class="p-4 text-right">% CHG</th>
                            <th class="p-4 text-right">DELIVERY QTY</th>
                        </tr>
                    </thead>
                    <tbody id="terminalTableBody" class="divide-y divide-slate-800/60 text-sm">
                        <tr>
                            <td colspan="5" class="text-center p-8 text-slate-400">डेटा लोड हो रहा है...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        let rawData = [];

        async function initTerminal() {
            try {
                const res = await fetch('data/processed/volume_breakout_scan.csv');
                const text = await res.text();
                rawData = parseCSV(text);
                
                // डिफॉल्ट: लेटेस्ट तारीख सेट करें
                if(rawData.length > 0) {
                    const latestDate = rawData[0].DATE;
                    document.getElementById('singleDate').value = formatDateForInput(latestDate);
                }
                
                applyFilters();
            } catch (err) {
                console.error("Error loading CSV:", err);
                document.getElementById('terminalTableBody').innerHTML = `
                    <tr><td colspan="5" class="text-center p-6 text-rose-400">डेटा लोड करने में विफल!</td></tr>`;
            }
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim().toUpperCase());
            
            return lines.slice(1).map(line => {
                const values = line.split(',').map(v => v.trim());
                let row = {};
                headers.forEach((h, idx) => { row[h] = values[idx] || ''; });
                return row;
            });
        }

        function formatDateForInput(dateStr) {
            // YYYY-MM-DD या DDMMYYYY को YYYY-MM-DD में बदलें
            if(!dateStr) return '';
            const parts = dateStr.split('-');
            if(parts.length === 3) return dateStr;
            return '';
        }

        function applyFilters() {
            const singleDate = document.getElementById('singleDate').value;
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;
            const symbol = document.getElementById('symbolSearch').value.toUpperCase().trim();

            let filtered = rawData.filter(item => {
                let match = true;
                const itemDate = item.DATE;

                if (singleDate && itemDate !== singleDate) match = false;
                if (fromDate && itemDate < fromDate) match = false;
                if (toDate && itemDate > toDate) match = false;
                if (symbol && !item.SYMBOL.includes(symbol)) match = false;

                return match;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('terminalTableBody');
            document.getElementById('stockCount').innerText = data.length;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center p-8 text-slate-500">कोई डेटा नहीं मिला</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(r => {
                const pct = parseFloat(r.PCT_CHANGE || 0);
                const pctClass = pct >= 0 ? 'text-emerald-400' : 'text-rose-500';
                
                // Delivery Qty Formatting (e.g., 234,550)
                const delivQty = Number(r.DELIV_QTY || 0).toLocaleString('en-US');
                const closePrice = parseFloat(r.CLOSE || 0).toFixed(2);

                return `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="p-4 text-slate-400 text-xs">${r.DATE}</td>
                        <td class="p-4 font-bold text-white tracking-wide">${r.SYMBOL}</td>
                        <td class="p-4 text-right font-medium text-slate-200">${closePrice}</td>
                        <td class="p-4 text-right font-bold ${pctClass}">
                            ${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%
                        </td>
                        <td class="p-4 text-right font-semibold text-slate-200">${delivQty}</td>
                    </tr>
                `;
            }).join('');
        }

        function resetFilters() {
            document.getElementById('singleDate').value = '';
            document.getElementById('fromDate').value = '';
            document.getElementById('toDate').value = '';
            document.getElementById('symbolSearch').value = '';
            renderTable(rawData);
        }

        window.onload = initTerminal;
    </script>
</body>
</html>
