<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F&O Delivery 2x Breakout Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 20px; }
        h2 { color: #00e676; text-align: center; }
        .filter-box { background: #1e1e1e; padding: 15px; border-radius: 8px; display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
        label { font-size: 14px; color: #bbb; }
        input, button { padding: 8px 12px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; }
        button { background: #00e676; color: #000; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #00c853; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #1e1e1e; }
        th, td { padding: 10px; border: 1px solid #333; text-align: center; font-size: 14px; }
        th { background: #2d2d2d; color: #00e676; }
        tbody tr { cursor: pointer; }
        tbody tr:hover { background: #2c2c2c; }
        .green { color: #00e676; font-weight: bold; }
        .red { color: #ff5252; font-weight: bold; }
        .badge { background: #333; padding: 3px 6px; border-radius: 4px; border: 1px solid #00e676; }

        /* Popup (Modal) CSS */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .modal-content { background-color: #1e1e1e; margin: 5% auto; padding: 20px; border: 1px solid #00e676; width: 80%; max-width: 700px; border-radius: 8px; }
        .close-btn { color: #ff5252; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h2>📊 F&O 2x Delivery Breakout Scanner</h2>

    <div class="filter-box">
        <div>
            <label>तारीख चुने:</label><br>
            <input type="date" id="singleDate">
        </div>
        <div>
            <label>From Date:</label><br>
            <input type="date" id="fromDate">
        </div>
        <div>
            <label>To Date:</label><br>
            <input type="date" id="toDate">
        </div>
        <div>
            <label>Symbol:</label><br>
            <input type="text" id="symbolSearch" placeholder="उदा. RELIANCE">
        </div>
        <div>
            <br>
            <button onclick="applyFilters()">फ़िल्टर लागू करें</button>
            <button onclick="resetFilters()" style="background:#ff5252; color:#fff;">रीसेट</button>
        </div>
    </div>

    <div id="stats" style="margin-bottom: 10px; color: #aaa;">लोड हो रहा है...</div>

    <table>
        <thead>
            <tr>
                <th>DATE</th>
                <th>SYMBOL</th>
                <th>CLOSE</th>
                <th>% CHANGE</th>
                <th>DELIVERY QTY</th>
                <th>BREAKOUT TYPE</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="6">डेटा लोड हो रहा है...</td></tr>
        </tbody>
    </table>

    <!-- Popup Modal Structure -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle" style="color:#00e676;"></h3>
            <p style="font-size:12px; color:#aaa;">(पिछला 10 दिनों का सामान्य डेटा बिना किसी फ़िल्टर के)</p>
            <table>
                <thead>
                    <tr>
                        <th>DATE</th>
                        <th>CLOSE</th>
                        <th>% CHANGE</th>
                        <th>DELIVERY QTY</th>
                    </tr>
                </thead>
                <tbody id="modalTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let rawData = [];
        let fullHistory = {};

        // 1. Load Breakout CSV
        Papa.parse("data/processed/volume_breakout_scan.csv", {
            download: true,
            header: true,
            complete: function(results) {
                rawData = results.data.filter(r => r.SYMBOL);
                displayData(rawData);
            }
        });

        // 2. Load Full History JSON
        fetch("data/processed/full_history_data.json")
            .then(res => res.json())
            .then(data => fullHistory = data)
            .catch(err => console.log("JSON Load Error:", err));

        function displayData(data) {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";
            document.getElementById("stats").innerText = `कुल रिकॉर्ड्स: ${data.length}`;

            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6">कोई डेटा नहीं मिला!</td></tr>`;
                return;
            }

            data.forEach(row => {
                const pct = parseFloat(row.PCT_CHANGE || 0);
                const pctClass = pct >= 0 ? 'green' : 'red';
                const tr = document.createElement("tr");

                // Add Click Event to open Popup
                tr.onclick = () => openHistoryPopup(row.SYMBOL, row.DATE);

                tr.innerHTML = `
                    <td>${row.DATE}</td>
                    <td><strong>${row.SYMBOL}</strong></td>
                    <td>${row.CLOSE}</td>
                    <td class="${pctClass}">${pct}%</td>
                    <td>${parseInt(row.DELIV_QTY).toLocaleString()}</td>
                    <td><span class="badge">${row.BREAKOUT_TYPE}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openHistoryPopup(symbol, selectedDate) {
            const modal = document.getElementById("historyModal");
            const modalTitle = document.getElementById("modalTitle");
            const modalTbody = document.getElementById("modalTableBody");

            modalTitle.innerText = `📈 ${symbol} - Last 10 Days History`;
            modalTbody.innerHTML = "";

            if (fullHistory[symbol]) {
                // Filter records up to selected date and get top 10
                let stockHistory = fullHistory[symbol]
                    .filter(item => item.DATE <= selectedDate)
                    .slice(0, 10);

                stockHistory.forEach(r => {
                    const pct = parseFloat(r.PCT_CHANGE || 0);
                    const pctClass = pct >= 0 ? 'green' : 'red';
                    const tr = document.createElement("tr");

                    tr.innerHTML = `
                        <td>${r.DATE}</td>
                        <td>${r.CLOSE}</td>
                        <td class="${pctClass}">${pct}%</td>
                        <td>${parseInt(r.DELIV_QTY).toLocaleString()}</td>
                    `;
                    modalTbody.appendChild(tr);
                });
            } else {
                modalTbody.innerHTML = `<tr><td colspan="4">हिस्ट्री डेटा उपलब्ध नहीं है!</td></tr>`;
            }

            modal.style.display = "block";
        }

        function closeModal() {
            document.getElementById("historyModal").style.display = "none";
        }

        function applyFilters() {
            const singleDate = document.getElementById("singleDate").value;
            const fromDate = document.getElementById("fromDate").value;
            const toDate = document.getElementById("toDate").value;
            const symbol = document.getElementById("symbolSearch").value.trim().toUpperCase();

            let filtered = rawData;
            if (singleDate) filtered = filtered.filter(r => r.DATE === singleDate);
            else if (fromDate && toDate) filtered = filtered.filter(r => r.DATE >= fromDate && r.DATE <= toDate);
            if (symbol) filtered = filtered.filter(r => r.SYMBOL.includes(symbol));

            displayData(filtered);
        }

        function resetFilters() {
            document.getElementById("singleDate").value = "";
            document.getElementById("fromDate").value = "";
            document.getElementById("toDate").value = "";
            document.getElementById("symbolSearch").value = "";
            displayData(rawData);
        }
    </script>
</body>
</html>
